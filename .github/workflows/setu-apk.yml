# Setu — build the debug APK and nothing else.
#
# The repo's own android-build.yml gates its APK job behind unit tests, lint and a
# native-checksum script. All useful, all slow, and any one of them failing blocks the
# artifact you actually want. This job just builds and uploads.
#
# Two failure modes this file defends against, both caused by the repo having been
# created on Windows (no exec bit, and git's CRLF handling):
#   * exit 126 from ./gradlew  -> the file is not executable
#   * exit 126 with a bad interpreter -> the file has CRLF line endings
# Both are fixed in-place at the start of the job, so CI works no matter what mode or
# line endings git has stored.
#
# No explicit SDK install step: the Android Gradle Plugin downloads the missing platform
# and build-tools itself, and gradle.properties does not disable that. An earlier version
# of this file hardcoded the sdkmanager path and died before Gradle ever started.

name: Build Setu APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repair the wrapper script
        run: |
          # Strip CRLF first: a \r on the shebang line makes the kernel look for an
          # interpreter that does not exist, which surfaces as the same exit 126 as a
          # missing exec bit.
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          find tools -name '*.sh' -exec sed -i 's/\r$//' {} + -exec chmod +x {} + || true

      - name: Diagnostics
        run: |
          echo "--- java ---"
          java -version
          echo "--- sdk ---"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "--- wrapper ---"
          ls -l gradlew
          file gradlew
          head -1 gradlew | cat -A | head -1

      # Never allowed to fail the job: if sdkmanager is not on PATH, the Android Gradle
      # Plugin accepts licences itself during the build.
      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # :app: rather than the root task, so the wear module is not built. It is not
      # needed for the phone APK and it is one more thing that can fail.
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: setu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setu-build-reports
          path: "**/build/reports/"
          if-no-files-found: ignore
