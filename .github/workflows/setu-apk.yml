# Setu — build the debug APK and nothing else.
#
# The repo's own android-build.yml gates its APK job behind unit tests, lint and a
# native-checksum script. All useful, all slow, and any one of them failing blocks the
# artifact you actually want. This job just builds and uploads.
#
# Run it from the Actions tab: "Build Setu APK" -> Run workflow. The APK lands in the
# run's Artifacts section as setu-debug-apk.zip.

name: Build Setu APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: setu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: setu-build-reports
          path: |
            **/build/reports/
          if-no-files-found: ignore
